<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Токтогул Реклама</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 40px 8%;
            /* ФОН .PNG УЧУН */
            background: linear-gradient(rgba(15, 7, 29, 0.4), rgba(15, 7, 29, 0.6)), url('bg.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Глассморфизм Премиум Карточкасы */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-top: 1px solid rgba(255, 255, 255, 0.35);
            border-left: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 32px;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        0 0 50px rgba(168, 85, 247, 0.25);
            position: relative;
        }

        .title {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2.5px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 4px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .title span {
            display: block;
            background: linear-gradient(135deg, #e9d5ff 0%, #c084fc 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.75rem;
            color: #e9d5ff;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 14px;
            opacity: 0.8;
            font-weight: 600;
        }

        /* Версия Бейджи */
        .version-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #e9d5ff;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 20px;
            margin-bottom: 24px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .version-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #c084fc;
            border-radius: 50%;
            box-shadow: 0 0 8px #c084fc;
        }

        /* Скриншоттор галереясы */
        .gallery-container {
            margin-bottom: 28px;
        }

        .gallery-title {
            font-size: 0.85rem;
            color: #d8b4fe;
            margin-bottom: 12px;
            text-align: left;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .screenshots-scroll {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 4px 2px 12px 2px;
            scrollbar-width: thin;
            scrollbar-color: rgba(168, 85, 247, 0.6) transparent;
        }

        .screenshots-scroll::-webkit-scrollbar {
            height: 6px;
        }

        .screenshots-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, #a855f7, #c084fc);
            border-radius: 10px;
        }

        .screenshot-item {
            flex: 0 0 115px;
            height: 230px;
            scroll-snap-align: start;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            background: rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .screenshot-item:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: #c084fc;
            box-shadow: 0 12px 25px rgba(168, 85, 247, 0.4);
        }

        .screenshot-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Премиум Неон Кнопка */
        .download-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 24px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.5),
                        inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #c084fc 0%, #9333ea 100%);
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.7),
                        0 0 25px rgba(168, 85, 247, 0.5);
        }

        .download-btn:active {
            transform: translateY(1px);
        }

        .download-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        /* Модалдык Галерея (Слайдер) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 20, 0.92);
            backdrop-filter: blur(15px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content-wrapper {
            position: relative;
            max-width: 90%;
            max-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            object-fit: contain;
        }

        /* Мурунку/Кийинки Навигация Баскычтары */
        .modal-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 24px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            user-select: none;
        }

        .modal-btn:hover {
            background: rgba(168, 85, 247, 0.6);
            border-color: #c084fc;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        .prev-btn { left: -60px; }
        .next-btn { right: -60px; }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 30px;
            font-size: 32px;
            color: #ffffff;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .close-btn:hover {
            opacity: 1;
            color: #c084fc;
        }

        .image-counter {
            margin-top: 15px;
            color: #d8b4fe;
            font-size: 0.9rem;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Мобилдик телефондорго ылайыкташтыруу */
        @media (max-width: 900px) {
            body {
                justify-content: center;
                padding: 24px 16px;
            }

            .glass-card {
                padding: 32px 20px;
                border-radius: 28px;
            }

            .title {
                font-size: 1.6rem;
            }

            .screenshot-item {
                flex: 0 0 100px;
                height: 200px;
            }

            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
            
            .modal-btn {
                background: rgba(0, 0, 0, 0.5);
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1 class="title">ТОКТОГУЛ <span>РЕКЛАМА</span></h1>
        <p class="subtitle">ЖАРНАМА – ӨНҮГҮҮНҮН КҮЧҮ</p>
        
        <div class="version-badge">Версия: 1.0.0</div>

        <!-- Скриншоттор (.jpg) -->
        <div class="gallery-container">
            <div class="gallery-title">
                <span>Тиркеменин скриншоттору</span>
            </div>
            <div class="screenshots-scroll">
                <div class="screenshot-item"><img src="img1.jpg" alt="Скриншот 1" onclick="openModal(0)"></div>
                <div class="screenshot-item"><img src="img2.jpg" alt="Скриншот 2" onclick="openModal(1)"></div>
                <div class="screenshot-item"><img src="img3.jpg" alt="Скриншот 3" onclick="openModal(2)"></div>
                <div class="screenshot-item"><img src="img4.jpg" alt="Скриншот 4" onclick="openModal(3)"></div>
                <div class="screenshot-item"><img src="img5.jpg" alt="Скриншот 5" onclick="openModal(4)"></div>
                <div class="screenshot-item"><img src="img6.jpg" alt="Скриншот 6" onclick="openModal(5)"></div>
                <div class="screenshot-item"><img src="img7.jpg" alt="Скриншот 7" onclick="openModal(6)"></div>
            </div>
        </div>
        
        <a href="https://expo.dev/artifacts/eas/9fjyRR2w-tvZSg1prOJcIW_c1unSRRzQXianf_pm-3A.apk" class="download-btn" download>
            <svg viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            Скачать APK
        </a>
    </div>

    <!-- Интерактивдүү Слайдер-Модал -->
    <div class="modal" id="imageModal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        
        <div class="modal-content-wrapper">
            <button class="modal-btn prev-btn" onclick="changeImage(-1)">❮</button>
            <img id="modalImg" src="" alt="Чоңойтулган сүрөт">
            <button class="modal-btn next-btn" onclick="changeImage(1)">❯</button>
        </div>
        
        <div class="image-counter" id="imageCounter">1 / 7</div>
    </div>

    <script>
        const images = [
            'img1.jpg',
            'img2.jpg',
            'img3.jpg',
            'img4.jpg',
            'img5.jpg',
            'img6.jpg',
            'img7.jpg'
        ];

        let currentIndex = 0;

        function openModal(index) {
            currentIndex = index;
            updateModalImage();
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function changeImage(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = images.length - 1;
            } else if (currentIndex >= images.length) {
                currentIndex = 0;
            }
            updateModalImage();
        }

        function updateModalImage() {
            document.getElementById('modalImg').src = images[currentIndex];
            document.getElementById('imageCounter').textContent = `${currentIndex + 1} / ${images.length}`;
        }

        // Клавиатура аркылуу башкаруу (Жебелер жана Esc)
        document.addEventListener('keydown', function(event) {
            const modal = document.getElementById('imageModal');
            if (modal.style.display === 'flex') {
                if (event.key === 'ArrowLeft') {
                    changeImage(-1);
                } else if (event.key === 'ArrowRight') {
                    changeImage(1);
                } else if (event.key === 'Escape') {
                    closeModal();
                }
            }
        });

        // Модалдан сырткары жерин чыкылдатканда жабуу
        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>

</body>
</html>
