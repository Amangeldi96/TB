<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Токтогул Базар</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 8%;
            background: url('Fon.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        .brand-logo-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 450px;
        }

        .brand-logo {
            width: 100%;
            max-width: 380px;
            height: auto;
            filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.5));
            animation: floatGlow 4s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes floatGlow {
            0% {
                transform: translateY(0);
                filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
            }
            100% {
                transform: translateY(-10px);
                filter: drop-shadow(0 0 35px rgba(192, 132, 252, 0.7));
            }
        }

        .mobile-logo {
            display: none;
            width: 110px;
            height: auto;
            margin: 0 auto 15px auto;
            filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.6));
            pointer-events: none;
        }

        .glass-card {
            background: rgba(22, 10, 40, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(216, 180, 254, 0.25);
            border-top: 1px solid rgba(255, 255, 255, 0.45);
            border-left: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 32px;
            padding: 36px 28px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7),
                        0 0 50px rgba(168, 85, 247, 0.3),
                        inset 0 0 20px rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 2;
        }

        .title {
            font-size: 1.85rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 4px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .title span {
            display: block;
            background: linear-gradient(135deg, #ffffff 0%, #d8b4fe 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.75rem;
            color: #e9d5ff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0.9;
            font-weight: 600;
        }

        .version-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(168, 85, 247, 0.25);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #f3e8ff;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 20px;
            margin-bottom: 24px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .gallery-container {
            margin-bottom: 24px;
        }

        .gallery-title {
            font-size: 0.85rem;
            color: #e9d5ff;
            margin-bottom: 12px;
            text-align: left;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .screenshots-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(168, 85, 247, 0.7) transparent;
        }

        .screenshots-scroll::-webkit-scrollbar {
            height: 5px;
        }

        .screenshots-scroll::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.7);
            border-radius: 10px;
        }

        .screenshot-item {
            flex: 0 0 110px;
            height: 220px;
            scroll-snap-align: start;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .screenshot-item:hover {
            transform: translateY(-4px) scale(1.03);
            border-color: #c084fc;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.5);
        }

        .screenshot-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.9) 0%, rgba(107, 33, 168, 0.95) 100%);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.5),
                        inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.95) 0%, rgba(126, 34, 206, 1) 100%);
            box-shadow: 0 15px 35px rgba(168, 85, 247, 0.7),
                        0 0 25px rgba(168, 85, 247, 0.5);
        }

        .download-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            pointer-events: none;
        }

        /* МОДАЛДЫК СЛАЙДЕР ЖАНА БАШКАРУУ БАСКЫЧТАРЫ */
        .modal {
            display: none;
            position: fixed;
            z-index: 99999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 3, 18, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-main-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            height: 80vh;
            padding: 0 20px;
        }

        .close-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999999;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            outline: none;
            padding: 0;
        }

        .close-btn svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.85);
            border-color: #f87171;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
        }

        .close-btn:hover svg {
            transform: rotate(90deg);
        }

        .close-btn:active {
            transform: scale(0.95);
        }

        .modal-slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            width: 100%;
            height: 100%;
            align-items: center;
            scrollbar-width: none;
        }

        .modal-slider::-webkit-scrollbar {
            display: none;
        }

        .modal-slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .modal-slide img {
            max-width: 90%;
            max-height: 75vh;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8),
                        0 0 40px rgba(168, 85, 247, 0.4);
            object-fit: contain;
            pointer-events: none;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            color: #ffffff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .nav-btn:hover {
            background: rgba(168, 85, 247, 0.7);
            border-color: #d8b4fe;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-btn svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
            pointer-events: none;
        }

        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        .image-counter {
            margin-top: 15px;
            color: #e9d5ff;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 22px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* ИШТЕП ЧЫГУУДАГЫ (DEV) БИЛДИРҮҮ МАКЕТИ */
        .dev-modal {
            display: none;
            position: fixed;
            z-index: 100000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 3, 18, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .dev-card {
            background: rgba(26, 11, 46, 0.85);
            border: 1px solid rgba(192, 132, 252, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 28px;
            padding: 32px 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8),
                        0 0 40px rgba(168, 85, 247, 0.4);
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .dev-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px auto;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(192, 132, 252, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        .dev-icon svg {
            width: 34px;
            height: 34px;
            fill: #d8b4fe;
        }

        .dev-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .dev-desc {
            font-size: 0.9rem;
            color: #e9d5ff;
            line-height: 1.5;
            margin-bottom: 24px;
            opacity: 0.9;
        }

        .dev-ok-btn {
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #9333ea 0%, #6b21a8 100%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 18px rgba(147, 51, 234, 0.4);
        }

        .dev-ok-btn:hover {
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(168, 85, 247, 0.6);
        }

        @media (max-width: 950px) {
            body {
                flex-direction: column;
                justify-content: center;
                padding: 30px 15px;
            }

            .brand-logo-container {
                display: none;
            }

            .mobile-logo {
                display: block;
            }

            .glass-card {
                padding: 30px 18px;
                max-width: 100%;
            }

            .modal-main-container {
                padding: 0 5px;
            }

            .nav-btn {
                width: 46px;
                height: 46px;
                background: rgba(0, 0, 0, 0.6);
            }

            .close-btn {
                top: 15px;
                right: 15px;
                width: 44px;
                height: 44px;
            }

            .close-btn svg {
                width: 22px;
                height: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="brand-logo-container">
        <img src="Logo.png" alt="T5 Логотип" class="brand-logo">
    </div>

    <div class="glass-card">
        <img src="Logo.png" alt="T5 Логотип" class="mobile-logo">

        <h1 class="title">ТОКТОГУЛ <span>БАЗАР</span></h1>
        <p class="subtitle">ЖАРНАМА – ӨНҮГҮҮНҮН КҮЧҮ</p>
        
        <div class="version-badge">Версия: 1.0.0</div>

        <div class="gallery-container">
            <div class="gallery-title">Тиркеменин скриншоттору:</div>
            <div class="screenshots-scroll">
                <div class="screenshot-item" onclick="openModal(0)"><img src="img1.jpg" alt="Скриншот 1"></div>
                <div class="screenshot-item" onclick="openModal(1)"><img src="img2.jpg" alt="Скриншот 2"></div>
                <div class="screenshot-item" onclick="openModal(2)"><img src="img3.jpg" alt="Скриншот 3"></div>
                <div class="screenshot-item" onclick="openModal(3)"><img src="img4.jpg" alt="Скриншот 4"></div>
                <div class="screenshot-item" onclick="openModal(4)"><img src="img5.jpg" alt="Скриншот 5"></div>
                <div class="screenshot-item" onclick="openModal(5)"><img src="img6.jpg" alt="Скриншот 6"></div>
                <div class="screenshot-item" onclick="openModal(6)"><img src="img7.jpg" alt="Скриншот 7"></div>
            </div>
        </div>
        
        <button class="download-btn" onclick="showDevAlert()">
            <svg viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            Скачать APK
        </button>
    </div>

    <!-- ТИРКЕМЕНИ КӨРҮҮ МОДАЛДЫК СЛАЙДЕР -->
    <div class="modal" id="imageModal">
        <button class="close-btn" onclick="closeModal()" aria-label="Жабуу">
            <svg viewBox="0 0 24 24">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>
        
        <div class="modal-main-container">
            <button class="nav-btn prev-btn" onclick="scrollSlide(-1)">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>

            <div class="modal-slider" id="modalSlider">
                <div class="modal-slide"><img src="img1.jpg" alt="1"></div>
                <div class="modal-slide"><img src="img2.jpg" alt="2"></div>
                <div class="modal-slide"><img src="img3.jpg" alt="3"></div>
                <div class="modal-slide"><img src="img4.jpg" alt="4"></div>
                <div class="modal-slide"><img src="img5.jpg" alt="5"></div>
                <div class="modal-slide"><img src="img6.jpg" alt="6"></div>
                <div class="modal-slide"><img src="img7.jpg" alt="7"></div>
            </div>

            <button class="nav-btn next-btn" onclick="scrollSlide(1)">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
        </div>
        
        <div class="image-counter" id="imageCounter">1 / 7</div>
    </div>

    <!-- "УЧУРДА ИШТЕП ЧЫГУУДА" МОДАЛДЫК ТЕРЕЗЕСИ -->
    <div class="dev-modal" id="devModal">
        <div class="dev-card">
            <div class="dev-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M22.7 19l-9.1-15.5c-.5-.8-1.7-.8-2.2 0L2.3 19c-.5.8.1 1.8 1.1 1.8h18.2c1 0 1.6-1 1.1-1.8zM12 18c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm1-4h-2v-4h2v4z"/>
                </svg>
            </div>
            <h2 class="dev-title">Учурда иштеп чыгууда</h2>
            <p class="dev-desc">Тиркеме активдүү даярдалууда жана жакынкы арада жүктөөгө даяр болот.</p>
            <button class="dev-ok-btn" onclick="closeDevAlert()">Түшүнүктүү</button>
        </div>
    </div>

<script>
    const slider = document.getElementById('modalSlider');
    const modal = document.getElementById('imageModal');
    const devModal = document.getElementById('devModal');
    const counter = document.getElementById('imageCounter');
    const slides = document.querySelectorAll('.modal-slide');
    const totalSlides = slides.length;
    let activeIndex = 0;

    // Сүрөт сактоого жана оң баскычка тыюу салуу
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.querySelectorAll('img').forEach(img => {
        img.setAttribute('draggable', 'false');
    });

    // Иштеп чыгууда билдирүүсүн башкаруу
    function showDevAlert() {
        devModal.style.display = 'flex';
    }

    function closeDevAlert() {
        devModal.style.display = 'none';
    }

    // Сүрөт модалын башкаруу
    function openModal(index) {
        modal.style.display
