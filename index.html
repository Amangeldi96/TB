<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Токтогул Реклама</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 40px 8%;
            /* ФОН .JPG ФОРМАТЫНДА */
            background: url('bg.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
        }

        /* Глассморфизм (Айнек) Карточкасы */
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.35);
            border-left: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 28px;
            padding: 36px 28px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(168, 85, 247, 0.2);
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .title span {
            display: block;
            background: linear-gradient(135deg, #c084fc 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.78rem;
            color: #e9d5ff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0.85;
        }

        /* Версия Бейджи */
        .version-badge {
            display: inline-block;
            background: rgba(168, 85, 247, 0.25);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #d8b4fe;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 14px;
            border-radius: 20px;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        /* Скриншоттор галереясы (Slider) */
        .gallery-container {
            margin-bottom: 24px;
            position: relative;
        }

        .gallery-title {
            font-size: 0.85rem;
            color: #d8b4fe;
            margin-bottom: 10px;
            text-align: left;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .screenshots-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: rgba(168, 85, 247, 0.5) transparent;
        }

        .screenshots-scroll::-webkit-scrollbar {
            height: 5px;
        }

        .screenshots-scroll::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.5);
            border-radius: 10px;
        }

        .screenshot-item {
            flex: 0 0 110px;
            height: 220px;
            scroll-snap-align: start;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.2);
        }

        .screenshot-item:hover {
            transform: scale(1.03);
            border-color: #a855f7;
        }

        .screenshot-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Неон Кнопка */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #9333ea 0%, #7e22ce 100%);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 25px rgba(147, 51, 234, 0.4),
                        inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            box-shadow: 0 15px 35px rgba(168, 85, 247, 0.6),
                        0 0 20px rgba(168, 85, 247, 0.4);
        }

        .download-btn:active {
            transform: translateY(1px);
        }

        .download-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* Сүрөттү чоңойтуп кароочу оWindow (Modal) */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
        }

        .modal img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
        }

        /* Мобилдик телефондорго ылайыкташтыруу */
        @media (max-width: 900px) {
            body {
                justify-content: center;
                padding: 24px 16px;
            }

            .glass-card {
                padding: 30px 20px;
                border-radius: 24px;
            }

            .title {
                font-size: 1.6rem;
            }

            .screenshot-item {
                flex: 0 0 100px;
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1 class="title">ТОКТОГУЛ <span>РЕКЛАМА</span></h1>
        <p class="subtitle">ЖАРНАМА – ӨНҮГҮҮНҮН КҮЧҮ</p>
        
        <div class="version-badge">Версия: 1.0.0</div>

        <!-- Скриншоттор (.jpg) -->
        <div class="gallery-container">
            <div class="gallery-title">Тиркеменин скриншоттору:</div>
            <div class="screenshots-scroll">
                <div class="screenshot-item"><img src="img1.jpg" alt="Скриншот 1" onclick="openModal(this.src)"></div>
                <div class="screenshot-item"><img src="img2.jpg" alt="Скриншот 2" onclick="openModal(this.src)"></div>
                <div class="screenshot-item"><img src="img3.jpg" alt="Скриншот 3" onclick="openModal(this.src)"></div>
                <div class="screenshot-item"><img src="img4.jpg" alt="Скриншот 4" onclick="openModal(this.src)"></div>
                <div class="screenshot-item"><img src="img5.jpg" alt="Скриншот 5" onclick="openModal(this.src)"></div>
                <div class="screenshot-item"><img src="img6.jpg" alt="Скриншот 6" onclick="openModal(this.src)"></div>
                <div class="screenshot-item"><img src="img7.jpg" alt="Скриншот 7" onclick="openModal(this.src)"></div>
                <div class="screenshot-item"><img src="img8.jpg" alt="Скриншот 8" onclick="openModal(this.src)"></div>
            </div>
        </div>
        
        <a href="https://expo.dev/artifacts/eas/U2-03fw9hUJWxjOXzG7NOEm2ZofjJtKsPQBVx74hRdY.apk" class="download-btn" download>
            <svg viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            Скачать APK
        </a>
    </div>

    <!-- Сүрөт чыкылдаганда чоңоюп көрүнүүчү терезе -->
    <div class="modal" id="imageModal" onclick="closeModal()">
        <img id="modalImg" src="" alt="Чоңойтулган сүрөт">
    </div>

    <script>
        function openModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>

</body>
</html>
