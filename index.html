<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Токтогул Базар</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between; /* ПКда: Сол жакта лого, оң жакта карточка */
            padding: 40px 8%;
            /* НЕГИЗГИ ФОН (302225.png) */
            background: url('fon.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* ПК Версиядагы Сол жактагы Бөлөк Логотип (302226.png) */
        .brand-logo-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 450px;
        }

        .brand-logo {
            width: 100%;
            max-width: 380px;
            height: auto;
            filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.5));
            animation: floatGlow 4s ease-in-out infinite alternate;
        }

        /* Логотиптин жеңил сүзүү жана жарык берүү анимациясы */
        @keyframes floatGlow {
            0% {
                transform: translateY(0);
                filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
            }
            100% {
                transform: translateY(-10px);
                filter: drop-shadow(0 0 35px rgba(192, 132, 252, 0.7));
            }
        }

        /* Мобилдик версияда гана көрүнүүчү логотип */
        .mobile-logo {
            display: none;
            width: 110px;
            height: auto;
            margin: 0 auto 15px auto;
            filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.6));
        }

        /* Премиум Айнек (Glassmorphism) Карточкасы */
        .glass-card {
            background: rgba(22, 10, 40, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(216, 180, 254, 0.25);
            border-top: 1px solid rgba(255, 255, 255, 0.45);
            border-left: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 32px;
            padding: 36px 28px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7),
                        0 0 50px rgba(168, 85, 247, 0.3),
                        inset 0 0 20px rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 2;
        }

        .title {
            font-size: 1.85rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 4px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .title span {
            display: block;
            background: linear-gradient(135deg, #ffffff 0%, #d8b4fe 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.75rem;
            color: #e9d5ff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0.9;
            font-weight: 600;
        }

        /* Версия Бейджи */
        .version-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(168, 85, 247, 0.25);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #f3e8ff;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 20px;
            margin-bottom: 24px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        /* Скриншоттор галереясы */
        .gallery-container {
            margin-bottom: 24px;
        }

        .gallery-title {
            font-size: 0.85rem;
            color: #e9d5ff;
            margin-bottom: 12px;
            text-align: left;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .screenshots-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(168, 85, 247, 0.7) transparent;
        }

        .screenshots-scroll::-webkit-scrollbar {
            height: 5px;
        }

        .screenshots-scroll::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.7);
            border-radius: 10px;
        }

        .screenshot-item {
            flex: 0 0 110px;
            height: 220px;
            scroll-snap-align: start;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.4);
        }

        .screenshot-item:hover {
            transform: translateY(-4px) scale(1.03);
            border-color: #c084fc;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.5);
        }

        .screenshot-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Неон Айнек Кнопка */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.9) 0%, rgba(107, 33, 168, 0.95) 100%);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.5),
                        inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.95) 0%, rgba(126, 34, 206, 1) 100%);
            box-shadow: 0 15px 35px rgba(168, 85, 247, 0.7),
                        0 0 25px rgba(168, 85, 247, 0.5);
        }

        .download-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* МОДАЛДЫК ГАЛЕРЕЯ (Айнек слайдер) */
        .modal {
            display: none;
            position: fixed;
            z-index: 99999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 3, 18, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-main-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            padding: 0 90px;
        }

        .modal-slider {
            display: flex;
            gap: 40px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            width: 100%;
            max-height: 80vh;
            padding: 20px 0;
            scrollbar-width: none;
        }

        .modal-slider::-webkit-scrollbar {
            display: none;
        }

        .modal-slide {
            flex: 0 0 100%;
            scroll-snap-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-slide img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8),
                        0 0 40px rgba(168, 85, 247, 0.4);
            object-fit: contain;
            user-select: none;
        }

        /* СҮРӨТТҮН СЫРТЫНДАГЫ СТРЕЛКАЛАР */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px);
            color: #ffffff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .nav-btn:hover {
            background: rgba(168, 85, 247, 0.5);
            border-color: #d8b4fe;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.7);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-btn svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
        }

        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 35px;
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 101;
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.5);
            border-color: #f87171;
            transform: rotate(90deg);
        }

        .image-counter {
            margin-top: 10px;
            color: #e9d5ff;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* МОБИЛДИК ТЕЛЕФОНДОРГО ЫЛАЙЫКТАШТЫРУУ */
        @media (max-width: 950px) {
            body {
                flex-direction: column;
                justify-content: center;
                padding: 30px 15px;
            }

            .brand-logo-container {
                display: none;
            }

            .mobile-logo {
                display: block;
            }

            .glass-card {
                padding: 30px 18px;
                max-width: 100%;
            }

            .modal-main-container {
                padding: 0 10px;
            }

            .nav-btn {
                width: 44px;
                height: 44px;
                background: rgba(0, 0, 0, 0.6);
            }

            .prev-btn { left: 5px; }
            .next-btn { right: 5px; }

            .close-btn {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="brand-logo-container">
        <img src="logo.png" alt="T5 Логотип" class="brand-logo">
    </div>

    <div class="glass-card">
        <img src="logo.png" alt="T5 Логотип" class="mobile-logo">

        <h1 class="title">ТОКТОГУЛ <span>БАЗАР</span></h1>
        <p class="subtitle">ЖАРНАМА – ӨНҮГҮҮНҮН КҮЧҮ</p>
        
        <div class="version-badge">Версия: 1.0.0</div>

        <div class="gallery-container">
            <div class="gallery-title">Тиркеменин скриншоттору:</div>
            <div class="screenshots-scroll">
                <div class="screenshot-item"><img src="img1.jpg" alt="Скриншот 1" onclick="openModal(0)"></div>
                <div class="screenshot-item"><img src="img2.jpg" alt="Скриншот 2" onclick="openModal(1)"></div>
                <div class="screenshot-item"><img src="img3.jpg" alt="Скриншот 3" onclick="openModal(2)"></div>
                <div class="screenshot-item"><img src="img4.jpg" alt="Скриншот 4" onclick="openModal(3)"></div>
                <div class="screenshot-item"><img src="img5.jpg" alt="Скриншот 5" onclick="openModal(4)"></div>
                <div class="screenshot-item"><img src="img6.jpg" alt="Скриншот 6" onclick="openModal(5)"></div>
                <div class="screenshot-item"><img src="img7.jpg" alt="Скриншот 7" onclick="openModal(6)"></div>
            </div>
        </div>
        
        <a href="https://expo.dev/artifacts/eas/9fjyRR2w-tvZSg1prOJcIW_c1unSRRzQXianf_pm-3A.apk" class="download-btn" download>
            <svg viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            Скачать APK
        </a>
    </div>

    <div class="modal" id="imageModal">
        <div class="close-btn" onclick="closeModal()">&times;</div>
        
        <div class="modal-main-container">
            <button class="nav-btn prev-btn" onclick="scrollSlide(-1)">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>

            <div class="modal-slider" id="modalSlider">
                <div class="modal-slide"><img src="img1.jpg" alt="1"></div>
                <div class="modal-slide"><img src="img2.jpg" alt="2"></div>
                <div class="modal-slide"><img src="img3.jpg" alt="3"></div>
                <div class="modal-slide"><img src="img4.jpg" alt="4"></div>
                <div class="modal-slide"><img src="img5.jpg" alt="5"></div>
                <div class="modal-slide"><img src="img6.jpg" alt="6"></div>
                <div class="modal-slide"><img src="img7.jpg" alt="7"></div>
            </div>

            <button class="nav-btn next-btn" onclick="scrollSlide(1)">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
        </div>
        
        <div class="image-counter" id="imageCounter">1 / 7</div>
    </div>

    <script>
        const slider = document.getElementById('modalSlider');
        const modal = document.getElementById('imageModal');
        const counter = document.getElementById('imageCounter');
        const totalSlides = document.querySelectorAll('.modal-slide').length;

        function openModal(index) {
            modal.style.display = 'flex';
            setTimeout(() => {
                goToSlide(index);
            }, 50);
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function goToSlide(index) {
            const slideWidth = slider.clientWidth;
            slider.scrollTo({
                left: slideWidth * index,
                behavior: 'smooth'
            });
            updateCounter(index + 1);
        }

        function scrollSlide(direction) {
            const slideWidth = slider.clientWidth;
            const currentIndex = Math.round(slider.scrollLeft / slideWidth);
            let nextIndex = currentIndex + direction;

            if (nextIndex < 0) nextIndex = totalSlides - 1;
            if (nextIndex >= totalSlides) nextIndex = 0;

            goToSlide(nextIndex);
        }

        function updateCounter(current) {
            counter.textContent = `${current} / ${totalSlides}`;
        }

        // Скролл/Свайп окуясын байкоо (номерди өзгөртүү үчүн)
        slider.addEventListener('scroll', () => {
            const slideWidth = slider.clientWidth;
            const currentIndex = Math.round(slider.scrollLeft / slideWidth) + 1;
            if (currentIndex >= 1 && currentIndex <= totalSlides) {
                updateCounter(currentIndex);
            }
        });

        // Жебелер (Клавиатура) аркылуу башкаруу
        document.addEventListener('keydown', (e) => {
            if (modal.style.display === 'flex') {
                if (e.key === 'ArrowLeft') scrollSlide(-1);
                if (e.key === 'ArrowRight') scrollSlide(1);
                if (e.key === 'Escape') closeModal();
            }
        });

        // Сыртты чыкылдатканда жабуу
        modal.addEventListener('click', (e) => {
            if (e.target === modal || e.target.classList.contains('modal-main-container')) {
                closeModal();
            }
        });
    </script>

</body>
    </html>
