<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Токтогул Базар</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="brand-logo-container">
        <img src="Logo.png" alt="T5 Логотип" class="brand-logo">
    </div>

    <div class="glass-card">
        <div class="views-counter">
            <svg viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            <span id="view-count">...</span>
        </div>

        <img src="Logo.png" alt="T5 Логотип" class="mobile-logo">

        <h1 class="title">ТОКТОГУЛ <span>БАЗАР</span></h1>
        <p class="subtitle">ЖАРНАМА – ӨНҮГҮҮНҮН КҮЧҮ</p>
        
        <div class="version-badge">Версия: 1.0.0</div>

        <div class="ads-nav">
            <button class="nav-tab active" onclick="switchTab('vip')">VIP Жарнама</button>
            <button class="nav-tab" onclick="switchTab('normal')">Жөнөкөй Жарнама</button>
        </div>

        <div id="ads-container" class="ads-container">
            <div class="loading-text">Жарнамалар жүктөлүүдө...</div>
        </div>

        <button type="button" class="download-btn" onclick="openDevAlert()">
            <svg viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            Скачать APK
        </button>
    </div>

    <div class="dev-modal" id="devModal">
        <div class="dev-card">
            <div class="dev-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M22.7 19l-9.1-15.5c-.5-.8-1.7-.8-2.2 0L2.3 19c-.5.8.1 1.8 1.1 1.8h18.2c1 0 1.6-1 1.1-1.8zM12 18c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm1-4h-2v-4h2v4z"/>
                </svg>
            </div>
            <h2 class="dev-title">Учурда иштеп чыгууда</h2>
            <p class="dev-desc">Тиркеме активдүү даярдалууда жана жакынкы арада жүктөөгө даяр болот.</p>
            <button type="button" class="dev-ok-btn" onclick="closeDevAlert()">Түшүнүктүү</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
